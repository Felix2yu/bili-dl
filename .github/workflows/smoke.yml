name: Smoke

# 每日真实网络探针：只做解析与取流，不落盘。
#
# 与 CI 的分工：CI 必须离线可重复（改代码有没有破坏逻辑），
# 这里要的恰恰相反 —— 站点改版时 CI 不会红，只有真实请求才知道。
# 失败即开 issue，标题带站点名，便于一眼看出是哪一家挂了。

on:
  schedule:
    - cron: '0 22 * * *' # 每日 22:00 UTC = 次日 06:00 CST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 站点探针
        id: probe
        run: go test -tags=integration ./smoke/ -v -count=1 -timeout 10m
        env:
          SMOKE_BILIBILI_URL: ${{ vars.SMOKE_BILIBILI_URL }}
          SMOKE_X_URL: ${{ vars.SMOKE_X_URL }}

      - name: 失败时开 issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '站点探针失败（需要检查取数路径）'
            const body = [
              `工作流：[${context.workflow} #${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '可能原因（按概率排序）：',
              '1. 站点改版，解析字段没了 —— 看日志里的「结构已变」；',
              '2. GitHub runner 到该站点网络不通 —— 看日志里的「网络不可达」；',
              '3. 内容本身被删/设为私密 —— 换一个测试链接即可。',
              '',
              '定位后请更新 `smoke/smoke_test.go` 的样本或对应适配器。'
            ].join('\n')

            // 已有同类未关闭 issue 时只追加评论，避免每日刷屏。
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'smoke',
              per_page: 1,
            })
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              })
              return
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['smoke'],
            })
